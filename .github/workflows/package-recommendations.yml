name: Package recommendations

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    branches: [bundlephobia]
    paths:
      - utils/similar-packages.catalog.json
      - utils/similarPackages.ts
      - .github/scripts/recommendation-quality.ts
      - .github/scripts/check-recommendation-changes.ts
      - .github/workflows/package-recommendations.yml
      - .github/package.json
      - packages/service-contracts/src/recommendations.contract.ts

permissions:
  contents: read

jobs:
  triage-issue:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'similar suggestion')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install automation dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'true'
        run: corepack yarn workspaces focus @bundlephobia/recommendation-automation --production
      - name: Check recommendation quality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/triage-package-recommendation.ts

  check-curated-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install automation dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'true'
        run: corepack yarn workspaces focus @bundlephobia/recommendation-automation --production
      - name: Check newly curated packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/check-recommendation-changes.ts
          ${{ github.event.pull_request.base.sha }}
