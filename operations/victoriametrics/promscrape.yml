global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: haproxy
    static_configs:
      - targets:
          - 127.0.0.1:8406
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s

  - job_name: bundlephobia_installations
    static_configs:
      - targets: ['127.0.0.1:7003']

  # Match process.yml's three build workers and BUILD_METRICS_BASE_PORT.
  - job_name: bundlephobia_builds
    static_configs:
      - targets: ['127.0.0.1:8410', '127.0.0.1:8411', '127.0.0.1:8412']
