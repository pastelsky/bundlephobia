global
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    maxconn 512
    hard-stop-after 70s
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    timeout connect 250ms
    timeout client 65s
    timeout server 60s
    timeout queue 3s
    timeout http-request 10s
    timeout http-keep-alive 10s
    retries 40

backend api_client_usage
    stick-table type ip size 100k expire 10m store http_req_rate(1m),gpc(1),gpc_rate(1,5m)

backend api_user_agent_usage
    stick-table type string len 256 size 100k expire 10m store http_req_rate(1m)

backend automated_client_usage
    stick-table type string len 64 size 100k expire 10m store http_req_rate(1m)

frontend bundlephobia_http
    bind :80

    acl request_from_cloudflare src -f /etc/haproxy/cloudflare-networks.lst
    acl valid_cloudflare_client_ip req.hdr_ip(CF-Connecting-IP) -m found

    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.hdr_ip(CF-Connecting-IP) if request_from_cloudflare valid_cloudflare_client_ip
    http-request set-header CF-Connecting-IP %[var(txn.client_ip)]

    acl api_request path_beg /api/
    acl hidden_path path_reg -i ^/\.(?!well-known/)
    acl backup_or_source_path path_reg -i (\.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp|swo)|~)$

    acl high_frequency_automation req.hdr(User-Agent),lower -m sub depscope
    acl strictly_limited_automation req.hdr(User-Agent),lower -m sub got ahrefs
    acl automated_client req.hdr(User-Agent),lower -m sub curl bot spider crawler headlesschrome prerender bytespider tiktokspider baiduspider bingbot googlebot petalbot semrushbot dotbot awariobot shields.io badgen

    http-request track-sc0 var(txn.client_ip) table api_client_usage if api_request
    http-request track-sc1 req.hdr(User-Agent) table api_user_agent_usage if api_request
    http-request track-sc2 var(txn.client_ip) table automated_client_usage if api_request high_frequency_automation
    http-request track-sc2 str(strictly-limited-automation) table automated_client_usage if api_request strictly_limited_automation !high_frequency_automation
    http-request track-sc2 str(automated-clients) table automated_client_usage if api_request automated_client !high_frequency_automation !strictly_limited_automation

    acl client_request_rate_exceeded sc_http_req_rate(0) gt 190
    acl user_agent_request_rate_exceeded sc_http_req_rate(1) gt 190
    acl automated_request_rate_exceeded sc_http_req_rate(2) gt 26
    acl strict_automation_request_rate_exceeded sc_http_req_rate(2) gt 8

    # Build duration is stored in 100 ms units. The limit is 60 seconds of
    # completed build work per client in a rolling five-minute window.
    acl client_build_duration_exceeded sc_gpc_rate(0,0) gt 600

    http-request deny deny_status 403 if hidden_path
    http-request deny deny_status 403 if backup_or_source_path
    http-request deny deny_status 429 if api_request client_build_duration_exceeded
    http-request deny deny_status 429 if api_request client_request_rate_exceeded
    http-request deny deny_status 429 if api_request user_agent_request_rate_exceeded
    http-request deny deny_status 429 if api_request strictly_limited_automation strict_automation_request_rate_exceeded
    http-request deny deny_status 429 if api_request !strictly_limited_automation automated_request_rate_exceeded

    http-response sc-add-gpc(0,0) res.hdr_val(X-Bundlephobia-Build-Duration-Ms),add(99),div(100) if { res.hdr(X-Bundlephobia-Build-Duration-Ms) -m found }
    http-response del-header X-Bundlephobia-Build-Duration-Ms

    http-after-response add-header X-UA-Compatible IE=Edge
    http-after-response add-header Cache-Control no-transform
    http-after-response add-header Access-Control-Allow-Origin "*"
    http-after-response add-header Access-Control-Allow-Headers "*"
    http-after-response add-header Access-Control-Allow-Methods "GET, OPTIONS"

    default_backend bundlephobia_application

backend bundlephobia_application
    # Cloudflare performs public compression. Avoid spending origin CPU on a
    # second compression pass.
    http-request del-header Accept-Encoding
    option abortonclose
    option forwardfor
    http-reuse safe
    retry-on conn-failure
    server main 127.0.0.1:5400
