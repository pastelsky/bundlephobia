global
    log /dev/log local0 info
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    maxconn 512
    tune.stick-counters 4
    hard-stop-after 70s
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 250ms
    timeout client 65s
    timeout server 60s
    timeout queue 3s
    timeout http-request 10s
    timeout http-keep-alive 10s
    retries 40

backend api_client_usage
    stick-table type ip size 100k expire 10m store gpc(1),gpc_rate(1,5m)

backend automated_client_usage
    stick-table type string len 64 size 100k expire 10m store http_req_rate(1m)

backend named_bot_usage
    stick-table type integer size 1 expire 10m store gpc(1),gpc_rate(1,1m)

backend client_group_usage
    stick-table type string len 64 size 100k expire 30m store http_req_rate(1m),gpc0,gpc0_rate(1m),gpc1,gpc1_rate(5m),gpt0

frontend bundlephobia_http
    bind :80

    log-format "client_ip=%[var(txn.client_ip)] method=%HM uri=%{+Q}HU status=%ST bytes=%B request_ms=%TR queue_ms=%Tw connect_ms=%Tc response_ms=%Tr total_ms=%Ta termination=%tsc user_agent=%{+Q}[var(txn.user_agent)] client=%{+Q}[var(txn.bundlephobia_user)] build_ms=%[var(txn.build_duration_ms)] client_group=%{+Q}[var(txn.client_group)] automation_budget=%{+Q}[var(txn.automation_budget)] cooldown_s=%[var(txn.cooldown_s)]"

    acl request_from_cloudflare src -f /etc/haproxy/cloudflare-networks.lst
    acl valid_cloudflare_client_ip req.hdr_ip(CF-Connecting-IP) -m found

    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.hdr_ip(CF-Connecting-IP) if request_from_cloudflare valid_cloudflare_client_ip
    http-request set-var(txn.user_agent) req.hdr(User-Agent)
    http-request set-var(txn.bundlephobia_user) req.hdr(X-Bundlephobia-User)
    http-request del-header X-KoaIP
    http-request set-header CF-Connecting-IP %[var(txn.client_ip)]

    acl stats_dashboard path_reg -i ^/stats(/|$)
    acl stats_authenticated http_auth(bundlephobia_stats_users)
    acl analysis_request path_beg /api/ /package/
    acl package_request path_beg /package/
    acl event_ingest_request path -m str /_events
    acl event_ingest_post method POST
    acl hidden_path path_reg -i ^/\.(?!well-known/)
    acl backup_or_source_path path_reg -i (\.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp|swo)|~)$

    # 1. Resolve trusted identity before classifying or counting requests.
    # Known automation families share an identity across IPs and UA versions.
    # Unmapped crawlers share their bot token across IPs and UA versions.
    # Ordinary browsers and generic HTTP clients remain grouped by trusted IP.
    http-request set-var(txn.automation_group) req.hdr(User-Agent),lower,map_sub(/etc/haproxy/automation-groups.map)
    acl crawler_family req.hdr(User-Agent),lower -m reg [a-z0-9_-]*(bot|spider|crawler)[a-z0-9_-]*
    http-request set-var(txn.automation_group) 'req.hdr(User-Agent),lower,regsub("^.*?\b([a-z0-9_-]*(bot|spider|crawler)[a-z0-9_-]*).*$","crawler:\1")' if !{ var(txn.automation_group) -m found } crawler_family
    http-request set-var(txn.client_group) var(txn.client_ip)
    http-request set-var(txn.client_group) var(txn.automation_group) if { var(txn.automation_group) -m found }
    acl automated_client var(txn.automation_group) -m found
    acl automated_client req.hdr(User-Agent),lower -m sub bot spider crawler headlesschrome prerender curl got

    # Reuse known automation identities; broader categories affect metrics only.
    acl headed_browser req.hdr(User-Agent),lower -m sub chrome/ crios/ firefox/ fxios/ safari/ edg/ edga/ edgios/ opr/ opera/
    acl headless_browser req.hdr(User-Agent),lower -m sub headlesschrome prerender phantomjs
    acl http_client req.hdr(User-Agent),lower -m sub curl/ got/ python-httpx python-requests python-urllib axios/ undici node wget/

    # Overwrite caller labels so request metrics share this classification.
    http-request set-header X-Bundlephobia-Client-Type non_bot
    http-request set-header X-Bundlephobia-Client-Type bot if automated_client
    http-request set-var(txn.client_family) str(other)
    http-request set-var(txn.client_family) str(headed_browser) if headed_browser
    http-request set-var(txn.client_family) str(other_bot) if automated_client
    http-request set-var(txn.client_family) str(http_client) if http_client
    http-request set-var(txn.client_family) str(headless_browser) if headless_browser
    http-request set-var(txn.client_family) var(txn.automation_group) if { var(txn.automation_group) -m found }
    http-request set-header X-Bundlephobia-Client-Family %[var(txn.client_family)]

    # Cache preference can serve an older built release; a miss may still build.
    http-request del-header X-Bundlephobia-Prefer-Cached
    http-request set-header X-Bundlephobia-Prefer-Cached true if automated_client package_request

    # Known public reads need no application work to answer a CORS preflight.
    # Keep permission checks out of analysis budgets; GET limits still apply.
    acl public_read_api path -m str /api/size /api/exports /api/exports-sizes /api/recent /api/package-history /api/trends /api/similar-packages /api/stats-image /api/mcp/tools
    http-request return status 204 hdr Access-Control-Max-Age 600 if public_read_api METH_OPTIONS { req.hdr(Origin) -m found } { req.hdr(Access-Control-Request-Method) -m str GET }

    # 2. Count the outer request once, including pages that call a local API.
    # Existing request pools keep their allowances; other crawlers get one per family.
    # Cooldowns use each original family (sc1), including derived crawler names.
    http-request set-var(txn.automation_budget) var(txn.client_group) if automated_client
    http-request set-var(txn.automation_budget) str(aggressive) if { var(txn.automation_group) -m str bytedance baidu petal }
    http-request set-var(txn.automation_budget) str(search) if { var(txn.automation_group) -m str bing apple yandex }
    http-request set-var(txn.automation_budget) str(ai) if { var(txn.automation_group) -m str openai anthropic amazon lightpanda }
    http-request set-var(txn.automation_budget) str(developer_tools) if { var(txn.automation_group) -m str shields badgen data-pipeline-enricher depscope }
    http-request set-var(txn.automation_budget) str(seo) if { var(txn.automation_group) -m str ahrefs semrush dotbot awario }
    http-request track-sc0 var(txn.client_ip) table api_client_usage if analysis_request
    http-request track-sc1 var(txn.client_group) table client_group_usage
    http-request track-sc2 var(txn.automation_budget) table automated_client_usage if analysis_request automated_client

    # Non-bot application traffic has one 120/5m/IP allowance at the proxy.
    # Count the outer request, excluding separately routed stats and telemetry.
    http-request sc-inc-gpc1(1) if !automated_client !stats_dashboard !event_ingest_request
    acl application_request_rate_exceeded sc_gpc1_rate(1) gt 120

    # This also supplies the per-IP ceiling for clients without a known family.
    acl group_request_rate_exceeded sc_http_req_rate(1) gt 190
    acl automated_request_rate_exceeded sc_http_req_rate(2) gt 26
    acl named_bot_rate_exceeded sc_gpc_rate(0,3) ge 100

    # Build duration uses 100 ms units: 60 seconds of completed work per IP/5m.
    # This measures completed work, rather than reserving queued/in-flight work.
    acl client_build_duration_exceeded sc_gpc_rate(0,0) gt 600

    # 3. Security and authentication precede rate-limit decisions.
    http-request deny deny_status 403 if hidden_path
    http-request deny deny_status 403 if backup_or_source_path
    http-request deny deny_status 403 if stats_dashboard !request_from_cloudflare
    http-request auth if stats_dashboard !stats_authenticated
    http-request deny deny_status 405 if event_ingest_request !event_ingest_post

    # 4. An active cooldown takes precedence over ordinary request ceilings.
    # Cooldowns stay isolated by family (or trusted IP for unknown clients).
    http-request set-var(txn.now) date
    acl group_cooldown_active sc_get_gpt0(1),sub(txn.now) gt 0
    acl group_repeated_abuse sc_gpc0_rate(1) ge 30
    acl group_persistent_abuse sc_gpc0_rate(1) ge 120
    http-request set-var(txn.cooldown_s) sc_get_gpt0(1),sub(txn.now) if group_cooldown_active
    http-request deny deny_status 429 if group_cooldown_active
    http-request deny deny_status 429 if group_request_rate_exceeded
    http-request deny deny_status 429 if !automated_client !stats_dashboard !event_ingest_request application_request_rate_exceeded
    http-request deny deny_status 429 if analysis_request automated_client automated_request_rate_exceeded

    # Charge the aggregate allowance only after family/pool checks pass.
    # Rejected retries do not keep the global rate high. Rates are estimates.
    http-request track-sc3 int(1) table named_bot_usage if analysis_request { var(txn.automation_group) -m found }
    http-request deny deny_status 429 if analysis_request { var(txn.automation_group) -m found } named_bot_rate_exceeded
    http-request sc-inc-gpc(0,3) if analysis_request { var(txn.automation_group) -m found }

    # 5. Signal exhausted build time; the server enforces it only after a miss.
    # This preserves cache hits without duplicating proxy policy in the server.
    # Internal page/MCP calls forward the signal, trusted IP and build duration.
    http-request del-header X-Bundlephobia-Build-Budget-Exceeded
    http-request set-header X-Bundlephobia-Build-Budget-Exceeded true if analysis_request client_build_duration_exceeded

    http-request set-var(txn.stats_html) bool(true) if { path -m str /stats/dashboard/ /stats/dashboard/index.html }
    http-request redirect location /stats/dashboard/ code 302 if { path -m str /stats /stats/ /stats/dashboard }

    http-response set-var(txn.build_duration_ms) res.hdr(X-Bundlephobia-Build-Duration-Ms) if { res.hdr(X-Bundlephobia-Build-Duration-Ms) -m found }
    http-response sc-add-gpc(0,0) res.hdr_val(X-Bundlephobia-Build-Duration-Ms),add(99),div(100) if { res.hdr(X-Bundlephobia-Build-Duration-Ms) -m found }
    http-response del-header X-Bundlephobia-Build-Duration-Ms

    # 6. Every returned 429 counts once, including application/internal API 429s.
    # After-response rules also run for HAProxy's own denials. Other 4xx do not
    # count. 30/min starts 5m; 120/min starts 15m and can renew with <=5m left.
    http-after-response set-var(txn.now) date if { status eq 429 }
    http-after-response sc-inc-gpc0(1) if { status eq 429 }
    http-after-response sc-set-gpt0(1) date,add(900) if { status eq 429 } group_persistent_abuse { sc_get_gpt0(1),sub(txn.now) le 300 }
    http-after-response sc-set-gpt0(1) date,add(300) if { status eq 429 } group_repeated_abuse !group_cooldown_active
    http-after-response set-var(txn.cooldown_s) sc_get_gpt0(1),sub(txn.now) if { status eq 429 } group_cooldown_active
    http-after-response set-header Retry-After "%[var(txn.cooldown_s)]" if { status eq 429 } group_cooldown_active
    http-after-response set-header Retry-After 60 if { status eq 429 } !{ res.hdr(Retry-After) -m found }

    http-after-response add-header X-UA-Compatible IE=Edge
    http-after-response add-header Access-Control-Allow-Origin "*"
    http-after-response add-header Access-Control-Allow-Headers "*"
    http-after-response add-header Access-Control-Allow-Methods "GET, OPTIONS"
    http-after-response set-header Cache-Control "private, no-store" if { var(txn.stats_html) -m bool }

    use_backend event_ingest if event_ingest_request
    use_backend bundlephobia_application if stats_dashboard { path_beg /stats/dashboard/ }
    use_backend bundlephobia_victoriametrics if stats_dashboard
    default_backend bundlephobia_application

backend event_ingest
    mode http
    http-request set-path /2/httpapi
    http-request set-header Host api2.amplitude.com
    server event_ingest api2.amplitude.com:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(api2.amplitude.com)

backend bundlephobia_application
    # Leave compression to Cloudflare instead of spending origin CPU on it.
    http-request del-header Accept-Encoding
    option abortonclose
    option forwardfor
    http-reuse safe
    retry-on conn-failure
    server main 127.0.0.1:5400

# Keep the stats dashboard private to the host. Access it through an SSH tunnel.
listen haproxy_stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
