frontend bundlephobia_victoriametrics_metrics
    bind 127.0.0.1:8406
    mode http
    no log
    http-request use-service prometheus-exporter

backend bundlephobia_victoriametrics
    mode http
    option httpchk GET /stats/health
    http-check expect status 200
    server victoria-metrics 127.0.0.1:8428 check
