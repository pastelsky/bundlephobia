# Bundlephobia Host Kernel Tuning
# Optimized for high-throughput ephemeral build workspaces & fast npm network transport.

# Memory & Swap balancing
# Prioritize evicting disposable file cache over paging out active Node.js processes
vm.swappiness = 10
# Eagerly reclaim unlinked directory dentries and inode metadata after node_modules rm -rf
vm.vfs_cache_pressure = 150

# Network stack tuning
# TCP BBR congestion control and Fair Queueing for low-latency npm tarball downloads
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Keep congestion window open on idle HTTP keep-alive connections
net.ipv4.tcp_slow_start_after_idle = 0
# Backlogs for bursty inbound/outbound connections
net.ipv4.tcp_max_syn_backlog = 2048
net.core.netdev_max_backlog = 2048
net.core.somaxconn = 4096
