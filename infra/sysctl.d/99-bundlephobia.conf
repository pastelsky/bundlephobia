# Bundlephobia Host Kernel Tuning
# Optimized for high-throughput ephemeral build workspaces & fast npm network transport.
#
# Workload Profile:
# - Thousands of ephemeral files in node_modules created, compiled, and unlinked in <30s.
# - High-volume outbound HTTPS downloads from registry.npmjs.org and Cloudflare CDN.
# - Transient compiler memory spikes during large multi-export builds.

# ==============================================================================
# Memory & Swap Subsystem
# ==============================================================================

# vm.swappiness (Default: 60)
# Why 10 instead of 60 or 0:
# - Default 60 treats file cache and process anonymous memory equally. On this host,
#   >5 GB of RAM is filesystem cache (mostly dead build files). Swapping active Node.js
#   heap to disk just to preserve temporary file cache degrades build throughput.
# - Setting 0 would disable swap entirely until an absolute OOM emergency, which risks
#   premature Linux OOM-killer invocations during outlier 100+ export compilations.
# - Setting 10 instructs kswapd to aggressively reclaim disposable file cache first,
#   while keeping swap available as a safe cushion for transient memory spikes.
vm.swappiness = 10

# vm.vfs_cache_pressure (Default: 100)
# Why 150 instead of 100:
# - Bundlephobia's installation and cleanup cycles create and recursively delete (rm -rf)
#   hundreds of directory trees per hour, causing >650 MB of orphaned directory dentries
#   and inodes to accumulate in kernel slab cache (SReclaimable).
# - A value of 150 directs kernel memory shrinkers to reclaim unlinked directory and
#   inode metadata more eagerly, returning physical RAM back to applications.
vm.vfs_cache_pressure = 150

# ==============================================================================
# Network Transport & TCP Tuning
# ==============================================================================

# net.core.default_qdisc & net.ipv4.tcp_congestion_control (Default: pfifo_fast & cubic)
# Why BBR + Fair Queueing (fq):
# - Cubic is a loss-based algorithm. Under transient packet jitter or edge bufferbloat,
#   Cubic interprets delays as severe congestion and halves its congestion window (cwnd).
# - BBR (Bottleneck Bandwidth and RTT) models maximum bandwidth and round-trip time
#   independently of packet loss, maintaining high throughput across public internet routes.
# - Empirical testing on this host showed an 80.9% drop in p95 download latency
#   (467.6 ms -> 89.1 ms) and a 78.1% gain in median transfer speed for npm package fetches.
# - Fair Queueing (fq) is required for BBR's pacing engine to distribute packets evenly.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# net.ipv4.tcp_slow_start_after_idle (Default: 1)
# Why 0:
# - When set to 1, Linux resets the congestion window back to 10 packets if an established
#   TCP connection goes idle for more than an RTT.
# - Setting 0 keeps the window open on persistent HTTP keep-alive connections (e.g. to the
#   npm registry and between internal service daemons), avoiding slow-start ramp-up penalties.
net.ipv4.tcp_slow_start_after_idle = 0

# Connection Backlogs (Defaults: syn_backlog=512, netdev_max_backlog=1000, somaxconn=4096)
# Why 2048 / 4096:
# - Absorbs bursty inbound HTTP requests and concurrent outbound npm registry connections
#   without dropping SYN packets or queueing overflows during peak build traffic.
net.ipv4.tcp_max_syn_backlog = 2048
net.core.netdev_max_backlog = 2048
net.core.somaxconn = 4096
